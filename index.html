<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Zydus SEZ-1 — Single Line Diagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__lead">
        <h1>Zydus SEZ-1 <span>· SLD</span></h1>
        <span class="chip" id="nodeCount"></span>
      </div>

      <div class="topbar__search">
        <svg class="search__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <input
          id="search"
          type="text"
          placeholder="Search energy meters…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-autocomplete="list"
          aria-controls="searchResults"
        />
        <button id="searchClear" class="search__clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 4 12 12M12 4 4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <ul id="searchResults" class="results" role="listbox" aria-label="Matching meters" hidden></ul>
      </div>

      <div class="topbar__tools">
        <button id="expandAll" type="button" aria-label="Expand all">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M10 2h4v4M14 2 9 7M6 14H2v-4M2 14l5-5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Expand all</span>
        </button>
        <button id="collapseAll" type="button" aria-label="Collapse all">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M14 6h-4V2M14 2 9 7M2 10h4v4M2 14l5-5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Collapse all</span>
        </button>
        <span class="sep"></span>
        <button id="fit" type="button" aria-label="Fit to view">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Fit</span>
        </button>
        <span class="sep"></span>
        <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
    </header>

    <div id="viewport">
      <div id="world">
        <svg id="wires" aria-hidden="true"></svg>
      </div>
    </div>

    <p class="hint">
      Drag to pan · scroll to pan · <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + scroll or pinch to zoom ·
      click a chevron to expand or collapse
    </p>

    <div id="measure" aria-hidden="true"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
